steps:
  # 1. Safely preserve live store.json and backup from currently published platform before build
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        mkdir -p data /workspace/backup_check
        echo "=== [Publish Step 1] Checking live platform data preservation ==="

        # Try to dynamically query the live Cloud Run service URL in project
        LIVE_URL=""
        if command -v gcloud >/dev/null 2>&1; then
          LIVE_URL=$(gcloud run services list --platform=managed --format='value(status.url)' 2>/dev/null | head -n 1 || true)
        fi

        URLS=()
        if [ -n "$LIVE_URL" ]; then
          URLS+=("$LIVE_URL/api/backup")
        fi
        URLS+=(
          "https://ais-pre-qnosikih43z4b2cia7jex2-678307131241.europe-west1.run.app/api/backup"
          "https://ais-dev-qnosikih43z4b2cia7jex2-678307131241.europe-west1.run.app/api/backup"
        )

        FOUND_REMOTE=false
        for target in "${URLS[@]}"; do
          echo "Checking $target ..."
          if curl -f -s -m 8 "$target" -o /workspace/backup_check/remote_store.json && [ -s /workspace/backup_check/remote_store.json ] && grep -q '"posts"' /workspace/backup_check/remote_store.json; then
            echo "Successfully retrieved live store from $target"
            FOUND_REMOTE=true
            break
          fi
        done

        # Compare item counts so we never overwrite a store with fewer posts or sessions
        count_posts() {
          local file="$1"
          if [ -f "$file" ]; then
            grep -o '"id":' "$file" | wc -l || echo 0
          else
            echo 0
          fi
        }

        LOCAL_COUNT=$(count_posts data/store.json)
        BACKUP_COUNT=$(count_posts data/store.backup.json)
        REMOTE_COUNT=0
        if [ "$FOUND_REMOTE" = true ]; then
          REMOTE_COUNT=$(count_posts /workspace/backup_check/remote_store.json)
        fi

        echo "Store item counts - Local: $LOCAL_COUNT, Local Backup: $BACKUP_COUNT, Remote Live: $REMOTE_COUNT"

        if [ "$FOUND_REMOTE" = true ] && [ "$REMOTE_COUNT" -ge "$LOCAL_COUNT" ]; then
          echo "Using live remote store with $REMOTE_COUNT items to preserve community activity."
          cp /workspace/backup_check/remote_store.json data/store.json
          cp /workspace/backup_check/remote_store.json data/store.backup.json
        elif [ -s data/store.json ] && [ "$LOCAL_COUNT" -gt 0 ]; then
          echo "Retaining existing workspace data/store.json with $LOCAL_COUNT items."
          cp data/store.json data/store.backup.json
        elif [ -s data/store.backup.json ] && [ "$BACKUP_COUNT" -gt 0 ]; then
          echo "Restoring from workspace data/store.backup.json with $BACKUP_COUNT items."
          cp data/store.backup.json data/store.json
        fi

        echo "Data preservation check complete. Active store.json verified."

  # 2. Build container image using Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/fansphere:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/fansphere:latest'
      - '.'

  # 3. Push image to registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/fansphere:$COMMIT_SHA'

images:
  - 'gcr.io/$PROJECT_ID/fansphere:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/fansphere:latest'

options:
  logging: CLOUD_LOGGING_ONLY
