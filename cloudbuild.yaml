steps:
  # Build container image using Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/fansphere:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/fansphere:latest'
      - '.'

  # Push image to registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/fansphere:$COMMIT_SHA'

images:
  - 'gcr.io/$PROJECT_ID/fansphere:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/fansphere:latest'

options:
  logging: CLOUD_LOGGING_ONLY
