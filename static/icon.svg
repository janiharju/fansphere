<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#DC2626" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Glow & Shield -->
  <g filter="url(#glow)">
    <!-- Gold Border Ring -->
    <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="12" />
    <!-- Red Disc -->
    <circle cx="256" cy="256" r="192" fill="url(#shieldGrad)" />
  </g>

  <!-- Football White Core -->
  <circle cx="256" cy="256" r="112" fill="#F8FAFC" stroke="url(#goldGrad)" stroke-width="6" />

  <!-- Football Classic Pentagons & Seams -->
  <!-- Central Pentagon -->
  <polygon points="256,220 288,244 276,280 236,280 224,244" fill="#0F172A" />

  <!-- Outer Pentagon Patches -->
  <!-- Top Patch -->
  <polygon points="256,150 272,172 240,172" fill="#1E293B" stroke="#CBD5E1" stroke-width="3" />
  <line x1="256" y1="172" x2="256" y2="220" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />

  <!-- Right Top Patch -->
  <polygon points="340,210 320,230 335,250" fill="#1E293B" stroke="#CBD5E1" stroke-width="3" />
  <line x1="320" y1="230" x2="288" y2="244" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />

  <!-- Right Bottom Patch -->
  <polygon points="315,310 300,290 325,275" fill="#1E293B" stroke="#CBD5E1" stroke-width="3" />
  <line x1="300" y1="290" x2="276" y2="280" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />

  <!-- Left Bottom Patch -->
  <polygon points="197,310 212,290 187,275" fill="#1E293B" stroke="#CBD5E1" stroke-width="3" />
  <line x1="212" y1="290" x2="236" y2="280" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />

  <!-- Left Top Patch -->
  <polygon points="172,210 192,230 177,250" fill="#1E293B" stroke="#CBD5E1" stroke-width="3" />
  <line x1="192" y1="230" x2="224" y2="244" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />

  <!-- Top Champion Star -->
  <polygon points="256,92 263,107 279,109 267,120 270,136 256,128 242,136 245,120 233,109 249,107" fill="url(#goldGrad)" />

  <!-- Subtle Nordic / Finland cross accent ribbon -->
  <path d="M 120 395 Q 256 425 392 395" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
</svg>
