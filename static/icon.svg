<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gold Gradient for Outer Shield Border -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Gold Gradient for Scarf and Supporter Silhouette -->
    <linearGradient id="goldFigure" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Navy Gradient for Left Shield Half -->
    <linearGradient id="navyHalf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Red Gradient for Right Shield Half -->
    <linearGradient id="redHalf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="60%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <!-- Drop Shadow for Shield -->
    <filter id="shieldShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Inner Shield Clip Path -->
    <clipPath id="innerShieldClip">
      <path d="M 256,105 
               C 290,118 340,126 385,126 
               C 385,250 355,340 256,420 
               C 157,340 127,250 127,126 
               C 172,126 222,118 256,105 Z" />
    </clipPath>
  </defs>

  <!-- SHIELD GROUP WITH DROP SHADOW -->
  <g filter="url(#shieldShadow)">
    <!-- 1. Outermost Gold Shield Rim -->
    <path d="M 256,65 
             C 300,82 365,92 418,92 
             C 418,255 380,375 256,468 
             C 132,375 94,255 94,92 
             C 147,92 212,82 256,65 Z" 
          fill="url(#goldRim)" />

    <!-- 2. Dark Navy Inner Border -->
    <path d="M 256,80 
             C 296,96 355,105 404,105 
             C 404,248 370,360 256,448 
             C 142,360 108,248 108,105 
             C 157,105 216,96 256,80 Z" 
          fill="#0B132B" stroke="#F59E0B" stroke-width="2" />

    <!-- 3. Fine White Pinstripe -->
    <path d="M 256,98 
             C 292,112 344,120 390,120 
             C 390,250 358,348 256,428 
             C 154,348 122,250 122,120 
             C 168,120 220,112 256,98 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="3.5" />

    <!-- 4. Inner Shield Base (Clipped for two-tone split) -->
    <g clip-path="url(#innerShieldClip)">
      <!-- Left Half: Navy Blue -->
      <rect x="0" y="0" width="256" height="512" fill="url(#navyHalf)" />
      
      <!-- Right Half: Crimson Red -->
      <rect x="256" y="0" width="256" height="512" fill="url(#redHalf)" />

      <!-- Top Center Vertical Split Line -->
      <line x1="256" y1="105" x2="256" y2="420" stroke="#FBBF24" stroke-width="1.5" stroke-opacity="0.4" />

      <!-- THREE GOLD STARS AT THE TOP -->
      <!-- Center Star (Larger) -->
      <polygon points="256,128 261,142 276,142 264,151 268,165 256,156 244,165 248,151 236,142 251,142" 
               fill="#FDE68A" stroke="#F59E0B" stroke-width="1" />
      <!-- Left Star (Slightly tilted) -->
      <polygon points="214,142 218,154 231,154 220,161 224,173 214,165 204,173 208,161 197,154 210,154" 
               fill="#FDE68A" stroke="#F59E0B" stroke-width="0.8" />
      <!-- Right Star (Slightly tilted) -->
      <polygon points="298,142 302,154 315,154 304,161 308,173 298,165 288,173 292,161 281,154 294,154" 
               fill="#FDE68A" stroke="#F59E0B" stroke-width="0.8" />

      <!-- LOWER SWOOSHES (Dynamic curve swooshes from bottom left) -->
      <!-- Bottom Blue & White Stripe -->
      <path d="M 125,280 C 145,250 170,265 195,305 C 160,330 140,360 135,370 C 120,335 120,305 125,280 Z" 
            fill="#FFFFFF" opacity="0.9" />
      <path d="M 132,295 C 150,268 175,282 200,320 C 175,342 155,368 150,378 C 135,348 132,320 132,295 Z" 
            fill="#0F172A" />

      <!-- Dynamic Gold Ribbon Swoosh -->
      <path d="M 138,320 C 165,275 205,295 245,340 C 215,365 185,385 168,396 C 150,368 142,345 138,320 Z" 
            fill="url(#goldRim)" stroke="#FFFFFF" stroke-width="1.5" />
      <path d="M 160,345 C 190,300 240,320 280,365 C 250,390 215,408 190,412 C 175,388 168,368 160,345 Z" 
            fill="url(#goldRim)" opacity="0.95" />

      <!-- CHEERING SUPPORTER SILHOUETTE (Body + Head) -->
      <!-- Supporter Torso & Neck -->
      <path d="M 235,335 C 235,295 240,265 246,245 C 248,240 252,238 256,238 C 260,238 264,240 266,245 C 272,265 277,295 277,335 Z" 
            fill="url(#goldFigure)" />
      
      <!-- Supporter Head -->
      <circle cx="256" cy="225" r="18" fill="url(#goldFigure)" stroke="#B45309" stroke-width="1" />

      <!-- Left Raised Arm -->
      <path d="M 244,248 C 230,230 205,195 180,180 C 185,174 195,174 202,180 C 220,198 240,228 250,248 Z" 
            fill="url(#goldFigure)" />

      <!-- Right Raised Arm -->
      <path d="M 268,248 C 282,230 307,195 332,180 C 327,174 317,174 310,180 C 292,198 272,228 262,248 Z" 
            fill="url(#goldFigure)" />

      <!-- CHEERING SUPPORTER SCARF HELD OVERHEAD -->
      <!-- Main Curved Scarf Banner -->
      <path d="M 165,188 
               C 175,170 190,166 215,164 
               C 240,162 272,162 297,164 
               C 322,166 337,170 347,188 
               C 340,196 325,182 297,180 
               C 272,178 240,178 215,180 
               C 187,182 172,196 165,188 Z" 
            fill="#FEF08A" stroke="url(#goldRim)" stroke-width="3" />

      <!-- Left Scarf Tail / End (Draping down left) -->
      <path d="M 165,188 C 158,198 150,215 142,226 C 148,228 156,220 162,210 C 166,202 168,195 165,188 Z" 
            fill="url(#goldRim)" />
      <polygon points="142,226 138,235 145,232 150,236 150,227" fill="#D97706" />

      <!-- Right Scarf Tail / End (Draping down right) -->
      <path d="M 347,188 C 354,198 362,215 370,226 C 364,228 356,220 350,210 C 346,202 344,195 347,188 Z" 
            fill="url(#goldRim)" />
      <polygon points="370,226 374,235 367,232 362,236 362,227" fill="#D97706" />

      <!-- Left Hand -->
      <ellipse cx="180" cy="180" rx="7" ry="5" fill="#FEF08A" stroke="#B45309" stroke-width="1" />
      <!-- Right Hand -->
      <ellipse cx="332" cy="180" rx="7" ry="5" fill="#FEF08A" stroke="#B45309" stroke-width="1" />

      <!-- FOOTBALL (Soccer Ball on Lower Right) -->
      <g transform="translate(325, 305)">
        <!-- Outer Ball Disc -->
        <circle cx="0" cy="0" r="46" fill="#FFFFFF" stroke="#DC2626" stroke-width="5" />
        
        <!-- Ball Red Pentagons & Facets -->
        <!-- Center Red Pentagon -->
        <polygon points="0,-12 12,-3 7,12 -7,12 -12,-3" fill="#DC2626" />

        <!-- Top Red Patch -->
        <polygon points="0,-27 9,-35 -9,-35" fill="#DC2626" />
        <line x1="0" y1="-12" x2="0" y2="-27" stroke="#475569" stroke-width="2.5" />

        <!-- Top-Right Red Patch -->
        <polygon points="25,-12 38,-15 32,-3" fill="#DC2626" />
        <line x1="12" y1="-3" x2="25" y2="-12" stroke="#475569" stroke-width="2.5" />

        <!-- Bottom-Right Red Patch -->
        <polygon points="22,18 32,28 36,15" fill="#DC2626" />
        <line x1="7" y1="12" x2="22" y2="18" stroke="#475569" stroke-width="2.5" />

        <!-- Bottom-Left Red Patch -->
        <polygon points="-22,18 -32,28 -36,15" fill="#DC2626" />
        <line x1="-7" y1="12" x2="-22" y2="18" stroke="#475569" stroke-width="2.5" />

        <!-- Top-Left Red Patch -->
        <polygon points="-25,-12 -38,-15 -32,-3" fill="#DC2626" />
        <line x1="-12" y1="-3" x2="-25" y2="-12" stroke="#475569" stroke-width="2.5" />

        <!-- Outer Ball Shading Arc -->
        <path d="M -35,28 A 46,46 0 0,0 35,28 Z" fill="#991B1B" opacity="0.3" />
      </g>

      <!-- BOTTOM ACCENT STAR -->
      <polygon points="256,388 259,396 268,396 261,402 263,410 256,405 249,410 251,402 244,396 253,396" 
               fill="#FDE68A" stroke="#F59E0B" stroke-width="0.8" />
    </g>
  </g>
</svg>
